<!doctype html>
<html lang="en">
  <head>
    <title>Github Profile search</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="icon" type="image/png" href="asset/image/copy.JPG" />
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="wrapper">
      <section class="Search_box">
        <input
          type="text"
          class="Input_bar"
          placeholder="Enter a github user name...."
        />
        <button class="Search_btn">Search User</button>
      </section>
      <main class="container">
        <section class="Profile_info">
          <a href="#" class="Profile-image"><img src="" alt="Avatar" class="Avatar" /></a>
          <div class="user-info">
            <p>Username :</p>
            <h2 id="Username" class="Username"></h2>
          </div>
          <div class="profile_stat">
            <p>Follower : <span class="Follower"></span></p>
            <p>Following : <span class="following"></span></p>
            <a href="#" target="_blank" class="profile_link" id="profile_link"
              >View Github Profile</a
            >
          </div>
        </section>
        <section class="Repository">
          <h3>Public Repository</h3>
          <input type="text" placeholder="Enter a Repository Name..." class="SearchRepo"/>
          <ul class="Repo_list">
            
          </ul>
        </section>
      </main>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
