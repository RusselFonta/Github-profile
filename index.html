<!doctype html>
<html lang="en">
  <head>
    <title>Github Profile search</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="icon" type="image/png" href="asset/image/copy.JPG" />
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="wrapper">
      <section class="Search_box">
        <input
          type="text"
          class="inputBar"
          placeholder="Enter a github user name...."
        />
        <button class="searchBtn">Search User</button>
      </section>
      <main class="container">
        <section class="profileInfo">
          <a
            href="#"
            class="profileImage"
            title="Go to profile"
            target="_blank"
            ><img src="asset/image/avatar.PNG" alt="Avatar" class="Avatar"
          /></a>
          <div class="userInfo">
            <p>Username :</p>
            <h2 class="username"></h2>
          </div>
          <div class="profileStat">
            <p>Follower : <span class="follower"></span></p>
            <p>Following : <span class="following"></span></p>
            <a href="#" target="_blank" class="profileLink"
              >View Github Profile</a
            >
          </div>
        </section>
        <section class="Repository">
          <h3>Public Repositories</h3>
          <input
            type="text"
            placeholder="Enter a Repository Name..."
            class="searchRepo"
          />
          <ul class="repoList"></ul>
        </section>
      </main>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
